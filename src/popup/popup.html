<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand-header">
      <img class="brand-icon" src="../icons/popup-brand.svg" width="22" height="22" alt="" />
      <h1 data-i18n="extensionName"></h1>
      <button id="settings-open" class="icon-button" type="button" data-i18n-aria-label="settingsTitle">
        <img src="../icons/gear.svg" width="18" height="18" alt="" />
      </button>
      <button id="settings-back" class="icon-button" type="button" data-i18n-aria-label="settingsBack" hidden>←</button>
    </header>
    <main>
      <section id="home-view">
      <p class="prompt" data-i18n="popupPrompt"></p>
      <div class="actions">
        <button id="save" class="primary" type="button" data-i18n="saveFullPage"></button>
        <button id="edit" type="button" data-i18n="editBeforeSaving"></button>
        <button id="cancel" class="danger" type="button" data-i18n="cancelExport" hidden></button>
      </div>
      <p id="status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
      </section>
      <section id="settings-view" aria-label="" data-i18n-aria-label="settingsTitle" hidden>
        <div class="settings-row"><label for="language" data-i18n="settingsLanguage"></label><select id="language" disabled><option value="auto" data-i18n="settingsAutomatic"></option></select></div>
        <div class="settings-row"><label for="header" data-i18n="settingsHeader"></label><select id="header" disabled></select></div>
        <div class="settings-row"><label for="footer" data-i18n="settingsFooter"></label><select id="footer" disabled></select></div>
        <p id="settings-status" role="alert" hidden></p>
      </section>
    </main>
    <footer>
      <a id="website-link" class="website-link" data-i18n-aria-label="openWebsite" title="" target="_blank" rel="noopener noreferrer">
        <img src="../icons/globe.svg" width="14" height="14" alt="" />
      </a>
      <a id="support-link" class="footer-link" data-i18n="supportThisProject" target="_blank" rel="noopener noreferrer"></a>
      <span class="separator" aria-hidden="true">·</span>
      <a id="review-link" class="footer-link is-disabled" role="link" aria-disabled="true" tabindex="0" data-i18n="rateThisExtension"></a>
      <span class="separator" aria-hidden="true">·</span>
      <a id="github-link" class="footer-link" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
