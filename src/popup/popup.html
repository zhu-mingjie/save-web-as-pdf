<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="extensionName"></h1>
      <p class="subtitle" data-i18n="popupSubtitle"></p>
      <button id="save" class="primary" type="button" data-i18n="saveFullPage"></button>
      <button id="edit" type="button" data-i18n="editBeforeSaving"></button>
      <button id="cancel" class="danger" type="button" data-i18n="cancelExport" hidden></button>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
