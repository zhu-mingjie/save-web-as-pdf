<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Preview — Save Web as PDF</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Save Web as PDF</h1>
        <p id="source"></p>
      </div>
      <label for="filename">
        <span>Filename</span>
        <input id="filename" type="text" readonly />
      </label>
      <button id="download" type="button" disabled>Download PDF</button>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite" aria-atomic="true">Loading preview…</p>
      <embed id="preview" type="application/pdf" title="Generated PDF preview" />
    </main>
    <script type="module" src="preview.js"></script>
  </body>
</html>
